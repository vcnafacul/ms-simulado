name: msSimulado
on:
  pull_request:
    branches: ["develop"]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install depends
        run: yarn
      - name: Build app MS Simulado
        run: yarn build
      - name: Run Test app MS Simulado
        run: yarn test
        env:
          NODE_ENV: test
          MONGODB: mongodb://localhost:27017/ms-simulado-test
  PUSH:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Checkout develop para a imagem refletir o estado da branch (evita “sumir” em homol)
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install depends
        run: yarn
      - name: Build app MS Simulado
        run: yarn build
      - name: Build Image
        run: docker build -t mssimulado -f ms.dockerfile .
      - name: docker tags
        run: docker tag mssimulado vcnafacul/simulado:latest
      - name: docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
      - name: Image Push
        run: docker push vcnafacul/simulado:latest
  DEPLOY_HOMOL:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'develop'
    needs: PUSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy em Homolog (Hostinger)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST_HOMOL }}
          username: ${{ secrets.DEPLOY_USER_HOMOL }}
          password: ${{ secrets.DEPLOY_PASS_HOMOL }}
          script: |
            chmod +x ~/subir_ms.sh
            ~/subir_ms.sh
