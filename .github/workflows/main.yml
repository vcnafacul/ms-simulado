# =============================================================================
# main - CI only (deploy é feito via tag no release.yml)
# =============================================================================

name: CI Main

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

jobs:
  CI:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - name: Install depends
        run: yarn
      - name: Build app MS Simulado
        run: yarn build
      - name: Run Test app MS Simulado
        run: yarn test
        env:
          NODE_ENV: test
          MONGODB: mongodb://localhost:27017/ms-simulado-test
